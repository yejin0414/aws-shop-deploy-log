<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#0f172a">결제 흐름 (토스페이먼츠 결제위젯)</text>
  <text x="30" y="64" font-size="14" fill="#64748b">금액은 브라우저가 아니라 서버(DB)에 저장된 값으로 검증한 뒤 승인</text>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="60" y="90" width="160" height="44" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="140" y="118" fill="#0f172a">브라우저</text>
    <rect x="420" y="90" width="160" height="44" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="500" y="118" fill="#166534">Django 서버</text>
    <rect x="780" y="90" width="160" height="44" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="860" y="118" fill="#1e40af">토스페이먼츠</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4">
    <line x1="140" y1="134" x2="140" y2="450"/><line x1="500" y1="134" x2="500" y2="450"/><line x1="860" y1="134" x2="860" y2="450"/>
  </g>
  <g font-size="13" fill="#334155" stroke-width="2">
    <line x1="140" y1="170" x2="494" y2="170" stroke="#334155" marker-end="url(#a)"/>
    <text x="160" y="162">① 주문서 제출 → 결제대기 주문 생성</text>
    <text x="160" y="190" fill="#64748b">금액은 DB 가격으로 계산해 저장</text>

    <line x1="140" y1="220" x2="854" y2="220" stroke="#334155" marker-end="url(#a)"/>
    <text x="160" y="212">② 결제위젯에서 카드 정보 입력 (클라이언트 키) → 카드 인증</text>

    <line x1="860" y1="270" x2="146" y2="270" stroke="#334155" marker-end="url(#a)"/>
    <text x="560" y="262">③ successUrl로 이동 (paymentKey, orderId, amount)</text>

    <line x1="140" y1="320" x2="494" y2="320" stroke="#334155" marker-end="url(#a)"/>
    <text x="160" y="312">④ 결제 성공 페이지 요청</text>

    <rect x="510" y="300" width="230" height="56" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="522" y="322" fill="#78350f" font-weight="700">⑤ 서버 검증</text>
    <text x="522" y="344" fill="#78350f">amount = DB 금액?  재고 충분?</text>

    <line x1="500" y1="386" x2="854" y2="386" stroke="#334155" marker-end="url(#a)"/>
    <text x="520" y="378">⑥ 승인 API 호출 (시크릿 키, 서버에서만)</text>

    <line x1="860" y1="420" x2="506" y2="420" stroke="#334155" marker-end="url(#a)"/>
    <text x="560" y="440">⑦ 승인 완료 → 결제완료·재고 차감·장바구니 비우기</text>
  </g>
</svg>
