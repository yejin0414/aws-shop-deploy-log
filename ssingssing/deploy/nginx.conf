server {
    listen 80;
    server_name _;

    client_max_body_size 10M;   # 관리자 상품 이미지 업로드

    location /static/ {
        alias /home/ec2-user/ssingssing/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /home/ec2-user/ssingssing/media/;   # USE_S3=false 일 때만 사용
    }

    location / {
        proxy_pass http://unix:/run/ssingssing/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
